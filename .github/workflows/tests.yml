name: PHP tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: Lint PHP files
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run tests
        run: php tests/run_tests.php
